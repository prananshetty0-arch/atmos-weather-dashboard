<!DOCTYPE html>
<html lang="en" data-theme="dark" class="map-html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Atmos — Weather Map</title>
  <meta name="description" content="Full-screen interactive weather map: search any place, switch weather layers, or tap anywhere for live conditions." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/map-page.css" />

  <script>
    // Applied before paint so the map page never flashes the wrong theme.
    document.documentElement.setAttribute("data-theme", localStorage.getItem("atmos-theme") || "dark");
  </script>
</head>
<body class="map-body">

  <div id="full-map" role="application" aria-label="Full-screen interactive weather map"></div>

  <!-- ================= TOP BAR: back, search, quick actions ================= -->
  <div class="glass map-topbar">
    <a href="index.html" class="map-back-btn" title="Back to dashboard" aria-label="Back to dashboard">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <div class="search-wrap">
      <form class="search-form" id="map-search-form" role="search">
        <label class="visually-hidden" for="map-city-input">Search for a place</label>
        <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" id="map-city-input" name="place" placeholder="Search a place…" autocomplete="off" maxlength="100"
               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="map-suggest-dropdown" />
      </form>
      <ul class="suggest-dropdown" id="map-suggest-dropdown" role="listbox" hidden></ul>
    </div>

    <div class="map-topbar-actions">
      <button id="map-unit-toggle" class="pill-toggle" type="button" title="Switch units" aria-label="Switch temperature units">°C</button>
      <button id="map-theme-toggle" class="icon-btn" type="button" title="Toggle dark / light mode" aria-label="Toggle dark or light mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A5.5 5.5 0 0 1 12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="map-fullscreen-toggle" class="icon-btn" type="button" title="Toggle full screen" aria-label="Toggle full screen">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <!-- ================= LAYER SWITCHER ================= -->
  <div class="glass map-layers-panel" id="map-layers-panel">
    <span class="map-layers-title">Weather layers</span>
    <!-- layer buttons injected by mapPage.js -->
  </div>

  <!-- ================= FLOATING ACTION BUTTONS ================= -->
  <div class="map-fab-stack">
    <button id="map-locate-btn" class="map-fab" type="button" title="Use my location" aria-label="Use my current location">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </div>

  <!-- ================= WEATHER INFO CARD ================= -->
  <div class="glass map-info-card" id="map-info-card">
    <button class="map-info-close" id="map-info-close" type="button" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div id="map-info-body">
      <p class="map-info-loading">Search a place or tap the map to see live conditions.</p>
    </div>
  </div>

  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script type="module" src="js/mapPage.js"></script>
</body>
</html>
